name: portfolio-dev

networks:
  portfolio_network:
  traefik_proxy:
    external: true

include:
  - docker-compose.common.yml


x-backend-common: &backend-common
  build:
    context: .
    dockerfile: docker/backend/Dockerfile
    target: development
  networks:
    - portfolio_network
  volumes:
    - ./backend:/app
    - portfolio_dev_static_data:/app/staticfiles
  environment: &backend-env
    DOCKER_ENV: "true"
    PYTHONPATH: "."
    TZ: "Europe/Warsaw"
    SECRET_KEY: ${SECRET_KEY}
    DB_NAME: portfolio_dev
    DB_USER: ${DB_USER}
    DB_PASSWORD: ${DB_PASSWORD}
    DB_HOST: ${DB_HOST:-db}
    DB_PORT: 5432
    ADMIN_DOMAIN: ${ADMIN_DOMAIN}
    API_DOMAIN: ${API_DOMAIN}
    CSRF_COOKIE_DOMAIN: ${CSRF_COOKIE_DOMAIN}
    ALLOWED_HOSTS: ${ALLOWED_HOSTS}
    CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
    EMAIL_HOST: ${EMAIL_HOST}
    EMAIL_PORT: ${EMAIL_PORT}
    EMAIL_USE_TLS: ${EMAIL_USE_TLS}
    EMAIL_HOST_USER: ${EMAIL_HOST_USER}
    EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
    DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL}
    CONTACT_EMAIL: ${CONTACT_EMAIL}
    SIMULATE_CONTACT_EMAILS: ${SIMULATE_CONTACT_EMAILS:-true}
    SESSION_COOKIE_DOMAIN: ${SESSION_COOKIE_DOMAIN}
    SENTRY_DSN: ${SENTRY_DSN}
    ENVIRONMENT: ${ENVIRONMENT:-production}
    PROJECT_OWNER: ${PROJECT_OWNER}
    REDIS_PASSWORD: ${REDIS_PASSWORD}
    SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
    OPENAI_API_KEY: ${OPENAI_API_KEY}
    SKIP_PERMISSION_FIX: ${SKIP_PERMISSION_FIX:-true}
    SSR_CACHE_INVALIDATION_URL: ""
    SSR_CACHE_INVALIDATION_TOKEN: ${SSR_CACHE_INVALIDATION_TOKEN:-dev-ssr-cache-token}
  depends_on:
    - db
    - redis


x-local-nginx-common: &local-nginx-common
  image: nginx:1.31.3-alpine
  depends_on:
    nginx-blocklist-init:
      condition: service_completed_successfully
    be:
      condition: service_healthy
  restart: unless-stopped
  environment:
    TZ: "Europe/Warsaw"
    ADMIN_DOMAIN: ${ADMIN_DOMAIN}
    API_DOMAIN: ${API_DOMAIN}
    SECURITY_CONTACT_EMAIL: ${SECURITY_CONTACT_EMAIL:-security@example.invalid}
  volumes:
    - ./infra/nginx/static_server.conf:/etc/nginx/nginx.conf:ro
    - ./infra/nginx/includes:/etc/nginx/includes:ro
    - ./infra/nginx/templates:/etc/nginx/text-resources/templates:ro
    - ./docker/nginx/18-render-text-resources.sh:/docker-entrypoint.d/18-render-text-resources.sh:ro
    - ./backend/media:/app/media:ro
    - ./infra/nginx/html/error.html:/usr/share/nginx/html/error.html:ro
    - ./infra/nginx/html/404.html:/usr/share/nginx/html/404.html:ro
    - portfolio_dev_static_data:/app/staticfiles:ro
    - nginx_blocklist:/etc/nginx/blocklist:ro

services:
  be:
    <<: *backend-common
    ports:
      - "127.0.0.1:8000:8000"
    command: >
      sh -c "
        python manage.py migrate --noinput &&
        python manage.py compilemessages --locale pl --ignore '.venv/*' &&
        python manage.py collectstatic --noinput &&
        python manage.py runserver 0.0.0.0:8000
      "
    healthcheck:
      test: ["CMD-SHELL", "curl -f -H 'X-Forwarded-Proto: https' http://127.0.0.1:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  test:
    <<: *backend-common
    profiles: [ "test" ]
    command: pytest
    volumes:
      - ./backend:/app
      - portfolio_dev_static_data:/app/staticfiles
      - ./:/repository:ro
    environment:
      <<: *backend-env
      SKIP_PERMISSION_FIX: true
      REPOSITORY_ROOT: /repository

  db:
    image: postgres:18
    restart: unless-stopped
    networks:
      - portfolio_network
    environment:
      POSTGRES_DB: portfolio_dev
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${DB_USER:-postgres} -d portfolio_dev"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - portfolio_dev_db_data:/var/lib/postgresql


  redis:
    build:
      context: ./docker/redis
    restart: unless-stopped
    networks:
      - portfolio_network
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6382:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping || redis-cli ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  celery-worker:
    init: true
    <<: *backend-common
    command: >
      watchmedo auto-restart
      --directory=./
      --pattern=*.py
      --ignore-patterns='*/tests/*;*/test_*.py'
      --recursive
      --
      celery -A settings worker -l info -Q celery
    restart: unless-stopped
    depends_on:
      - db
      - redis
    healthcheck:
      test: ["CMD-SHELL", "exec celery -A settings inspect --timeout 5 ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  flower:
    <<: *backend-common
    command: sh -c 'export CELERY_BROKER_URL="redis://:$$REDIS_PASSWORD@redis:6379/0" && export CELERY_RESULT_BACKEND="redis://:$$REDIS_PASSWORD@redis:6379/0" && exec celery -A settings flower'
    ports:
      - "127.0.0.1:5555:5555"
    restart: unless-stopped
    environment:
      FLOWER_BASIC_AUTH: ${FLOWER_BASIC_AUTH:-admin:admin}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      celery-worker:
        condition: service_healthy

  nginx:
    <<: *local-nginx-common
    networks:
      - portfolio_network
      - traefik_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portfolio-dev.rule=Host(`${SITE_DOMAIN:-portfolio.local}`)"
      - "traefik.http.routers.portfolio-dev.entrypoints=websecure"
      - "traefik.http.routers.portfolio-dev.tls=true"
      - "traefik.http.routers.portfolio-dev.middlewares=public-security@file"
      - "traefik.http.routers.portfolio-dev-admin.rule=Host(`admin.${SITE_DOMAIN:-portfolio.local}`)"
      - "traefik.http.routers.portfolio-dev-admin.entrypoints=websecure"
      - "traefik.http.routers.portfolio-dev-admin.tls=true"
      - "traefik.http.routers.portfolio-dev-admin.middlewares=admin-api-security@file,rate-limit@file"
      - "traefik.http.services.portfolio-dev.loadbalancer.server.port=80"

volumes:
  portfolio_dev_db_data:
    external: true
  portfolio_dev_static_data:
    external: true
