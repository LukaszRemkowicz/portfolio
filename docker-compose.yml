name: portfolio-dev

networks:
  portfolio_network:


x-backend-common: &backend-common
  build:
    context: .
    dockerfile: docker/backend/Dockerfile
    target: development
  networks:
    - portfolio_network
  volumes:
    - ./backend:/app
    - portfolio_dev_static_data:/app/staticfiles
  environment: &backend-env
    DOCKER_ENV: "true"
    PYTHONPATH: "."
    TZ: "Europe/Warsaw"
    SECRET_KEY: ${SECRET_KEY}
    DB_NAME: portfolio_dev
    MEDIA_STORAGE: ${MEDIA_STORAGE:-local}
    DB_USER: ${DB_USER}
    DB_PASSWORD: ${DB_PASSWORD}
    DB_HOST: ${DB_HOST:-db}
    DB_PORT: 5432
    # Admin and /media/ are served on localhost (no Traefik, no admin.portfolio.local).
    ADMIN_DOMAIN: localhost
    API_DOMAIN: ${API_DOMAIN}
    # Served on http://localhost:8000 (no Traefik): host-only cookies, localhost origins.
    CSRF_COOKIE_DOMAIN: ""
    ALLOWED_HOSTS: ${ALLOWED_HOSTS}
    CSRF_TRUSTED_ORIGINS: http://localhost:8000,http://127.0.0.1:8000
    EMAIL_HOST: ${EMAIL_HOST}
    EMAIL_PORT: ${EMAIL_PORT}
    EMAIL_USE_TLS: ${EMAIL_USE_TLS}
    EMAIL_HOST_USER: ${EMAIL_HOST_USER}
    EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
    DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL}
    CONTACT_EMAIL: ${CONTACT_EMAIL}
    SIMULATE_CONTACT_EMAILS: ${SIMULATE_CONTACT_EMAILS:-true}
    SESSION_COOKIE_DOMAIN: ""
    SENTRY_DSN: ${SENTRY_DSN}
    ENVIRONMENT: ${ENVIRONMENT:-production}
    PROJECT_OWNER: ${PROJECT_OWNER}
    SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
    OPENAI_API_KEY: ${OPENAI_API_KEY}
    SKIP_PERMISSION_FIX: ${SKIP_PERMISSION_FIX:-true}
  depends_on:
    - db


services:
  be:
    <<: *backend-common
    ports:
      - "127.0.0.1:8000:8000"
    command: >
      sh -c "
        python manage.py migrate --noinput &&
        python manage.py createcachetable &&
        python manage.py compilemessages --locale pl --ignore '.venv/*' &&
        python manage.py collectstatic --noinput &&
        python manage.py runserver 0.0.0.0:8000
      "
    healthcheck:
      test: ["CMD-SHELL", "curl -f -H 'X-Forwarded-Proto: https' http://127.0.0.1:8000/admin/login/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  test:
    <<: *backend-common
    profiles: [ "test" ]
    command: pytest
    volumes:
      - ./backend:/app
      - portfolio_dev_static_data:/app/staticfiles
      - ./:/repository:ro
    environment:
      <<: *backend-env
      SKIP_PERMISSION_FIX: true
      REPOSITORY_ROOT: /repository

  db:
    image: postgres:18
    restart: unless-stopped
    networks:
      - portfolio_network
    environment:
      POSTGRES_DB: portfolio_dev
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${DB_USER:-postgres} -d portfolio_dev"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - portfolio_dev_db_data:/var/lib/postgresql


volumes:
  portfolio_dev_db_data:
    external: true
  portfolio_dev_static_data:
    external: true
