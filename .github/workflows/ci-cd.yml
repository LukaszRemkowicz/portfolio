name: CI/CD

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  backend-quality:
    uses: LukaszRemkowicz/ci-cd/.github/workflows/python-quality-uv.yml@main
    with:
      working_directory: backend
      quality_environment: |
        PROJECT_OWNER=test
        SESSION_COOKIE_DOMAIN=.example.com

  backend-tests:
    uses: LukaszRemkowicz/ci-cd/.github/workflows/python-tests-uv.yml@main
    with:
      working_directory: backend
      postgres_enabled: true
      postgres_db: test_db
      postgres_user: postgres
      postgres_password: postgres
      postgres_port: "5432"
      test_environment: |
        PROJECT_OWNER=test
        SESSION_COOKIE_DOMAIN=.example.com

  # Scans and image builds start together with tests instead of waiting for
  # them (they do not depend on test results); pr-status still waits for all.
  trivy-scan:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: LukaszRemkowicz/ci-cd/.github/workflows/trivy-scan.yml@main

  dependency-security:
    name: Dependency Security Checks
    runs-on: ubuntu-latest
    environment: portfolio_tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Safety CLI to check for vulnerabilities
        uses: pyupio/safety-action@v1
        with:
          api-key: ${{ secrets.SAFETY_API_KEY }}

  image-build-check:
    # The VPS is linux/amd64: no arm64/QEMU emulation (it took ~5 min per image).
    # One job per image in parallel; each image keeps its own GHA cache scope so
    # builds stop overwriting each other's cache.
    name: Production Image Build Check (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            file: docker/backend/Dockerfile
            target: production
          - image: nginx
            file: docker/nginx/Dockerfile
            target: ""
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.image }} image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: false
          tags: landingpage-nginx-text-resources:ci
          load: ${{ matrix.image == 'nginx' }}
          cache-from: type=gha,scope=image-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.image }}

      - name: Nginx integration tests
        if: matrix.image == 'nginx'
        env:
          NGINX_TEST_IMAGE: landingpage-nginx-text-resources:ci
        run: python3 -m unittest discover -s infra/nginx/tests -p 'test_*.py' -v

  pr-status:
    needs: [backend-quality, backend-tests, trivy-scan, dependency-security, image-build-check]
    if: always()
    uses: LukaszRemkowicz/ci-cd/.github/workflows/pr-status.yml@main
    with:
      status_items_json: >-
        {"Backend Quality":"${{ needs.backend-quality.result }}","Backend Tests":"${{ needs.backend-tests.result }}","Trivy Security Analysis":"${{ needs.trivy-scan.result }}","Dependency Security Checks":"${{ needs.dependency-security.result }}","Production Image Build Check":"${{ needs.image-build-check.result }}"}
      success_message: 🎉 **All checks passed!**
      failure_message: ⚠️ **Some checks failed. Please review the logs.**
