<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" aria-label="Production architecture: the visitor's browser loads pages from the Cloudflare Worker, which calls the Supabase Edge Function, which reads Supabase Postgres, presigns private R2 originals and sends contact mail through Resend. Public images come straight from the R2 media domain. The Django admin runs locally against Supabase Postgres and R2; GitHub Actions publish the admin image and deploy the Worker.">
  <style>
    .fg { fill: #1f2937; }
    .muted { fill: #6b7280; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; }
    .hot { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.6; }
    .frame { fill: none; stroke: #d1d5db; stroke-width: 1.2; stroke-dasharray: 2 4; }
    .req { stroke: #2563eb; stroke-width: 2; fill: none; }
    .ops { stroke: #6b7280; stroke-width: 1.5; fill: none; stroke-dasharray: 6 4; }
    .req-head { fill: #2563eb; }
    .ops-head { fill: #6b7280; }
    .accent { fill: #2563eb; }
    @media (prefers-color-scheme: dark) {
      .fg { fill: #e5e7eb; }
      .muted { fill: #9ca3af; }
      .box { fill: #161b22; stroke: #6b7280; }
      .hot { fill: #0c1d3a; stroke: #60a5fa; }
      .frame { stroke: #4b5563; }
      .req { stroke: #60a5fa; }
      .ops { stroke: #9ca3af; }
      .req-head { fill: #60a5fa; }
      .ops-head { fill: #9ca3af; }
      .accent { fill: #60a5fa; }
    }
  </style>
  <defs>
    <marker id="a-req" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="req-head"/>
    </marker>
    <marker id="a-ops" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="ops-head"/>
    </marker>
  </defs>

  <!-- Frames -->
  <rect class="frame" x="235" y="45" width="250" height="105" rx="10"/>
  <text class="muted" x="247" y="64" font-size="11" font-weight="600">CLOUDFLARE WORKERS</text>
  <rect class="frame" x="565" y="45" width="230" height="230" rx="10"/>
  <text class="muted" x="577" y="64" font-size="11" font-weight="600">SUPABASE</text>
  <rect class="frame" x="865" y="45" width="210" height="230" rx="10"/>
  <text class="muted" x="877" y="64" font-size="11" font-weight="600">CLOUDFLARE R2</text>
  <rect class="frame" x="235" y="420" width="560" height="150" rx="10"/>
  <text class="muted" x="247" y="439" font-size="11" font-weight="600">YOUR MACHINE</text>
  <rect class="frame" x="20" y="420" width="190" height="150" rx="10"/>
  <text class="muted" x="32" y="439" font-size="11" font-weight="600">GITHUB</text>

  <!-- Boxes: visitor request path -->
  <rect class="hot" x="30" y="75" width="150" height="60" rx="8"/>
  <text class="fg" x="105" y="101" font-size="13" font-weight="700" text-anchor="middle">Visitor's browser</text>
  <text class="muted" x="105" y="119" font-size="11" text-anchor="middle">lukaszremkowicz.com</text>

  <rect class="hot" x="250" y="75" width="220" height="60" rx="8"/>
  <text class="fg" x="360" y="101" font-size="13" font-weight="700" text-anchor="middle">Worker · portfolio-fe</text>
  <text class="muted" x="360" y="119" font-size="11" text-anchor="middle">React Router SSR + BFF /app/*</text>

  <rect class="hot" x="580" y="75" width="200" height="60" rx="8"/>
  <text class="fg" x="680" y="101" font-size="13" font-weight="700" text-anchor="middle">Edge Function api</text>
  <text class="muted" x="680" y="119" font-size="11" text-anchor="middle">Deno · /v1/*</text>

  <rect class="hot" x="580" y="205" width="200" height="55" rx="8"/>
  <text class="fg" x="680" y="229" font-size="13" font-weight="700" text-anchor="middle">Postgres 17</text>
  <text class="muted" x="680" y="246" font-size="11" text-anchor="middle">tables owned by Django</text>

  <rect class="box" x="880" y="75" width="180" height="60" rx="8"/>
  <text class="fg" x="970" y="101" font-size="13" font-weight="700" text-anchor="middle">portfolio-media</text>
  <text class="muted" x="970" y="119" font-size="11" text-anchor="middle">public image variants</text>

  <rect class="box" x="880" y="205" width="180" height="55" rx="8"/>
  <text class="fg" x="970" y="229" font-size="13" font-weight="700" text-anchor="middle">portfolio-originals</text>
  <text class="muted" x="970" y="246" font-size="11" text-anchor="middle">private sources, DB backups</text>

  <rect class="box" x="880" y="320" width="160" height="50" rx="8"/>
  <text class="fg" x="960" y="342" font-size="13" font-weight="700" text-anchor="middle">Resend</text>
  <text class="muted" x="960" y="359" font-size="11" text-anchor="middle">contact e-mail</text>

  <!-- Boxes: admin and delivery -->
  <rect class="box" x="580" y="465" width="200" height="60" rx="8"/>
  <text class="fg" x="680" y="491" font-size="13" font-weight="700" text-anchor="middle">Django admin</text>
  <text class="muted" x="680" y="509" font-size="11" text-anchor="middle">docker · run_admin.sh</text>

  <rect class="box" x="300" y="465" width="200" height="60" rx="8"/>
  <text class="fg" x="400" y="491" font-size="13" font-weight="700" text-anchor="middle">Supabase CLI</text>
  <text class="muted" x="400" y="509" font-size="11" text-anchor="middle">deploy-api.sh</text>

  <rect class="box" x="35" y="465" width="160" height="60" rx="8"/>
  <text class="fg" x="115" y="491" font-size="13" font-weight="700" text-anchor="middle">GitHub Actions</text>
  <text class="muted" x="115" y="509" font-size="11" text-anchor="middle">release · backups</text>

  <!-- Visitor request path -->
  <line class="req" x1="180" y1="105" x2="248" y2="105" marker-end="url(#a-req)"/>
  <text class="accent" x="214" y="98" font-size="11" text-anchor="middle">pages</text>
  <line class="req" x1="470" y1="105" x2="578" y2="105" marker-end="url(#a-req)"/>
  <text class="accent" x="524" y="98" font-size="11" text-anchor="middle">SSR + BFF</text>
  <text class="muted" x="518" y="122" font-size="10" text-anchor="middle">x-origin-secret</text>
  <line class="req" x1="680" y1="135" x2="680" y2="203" marker-end="url(#a-req)"/>
  <text class="accent" x="688" y="174" font-size="11">read-only role</text>
  <polyline class="req" points="105,75 105,24 1030,24 1030,73" marker-end="url(#a-req)"/>
  <text class="accent" x="537" y="17" font-size="11" text-anchor="middle">images straight from media.lukaszremkowicz.com</text>
  <polyline class="req" points="780,90 850,90 850,232 878,232" marker-end="url(#a-req)"/>
  <text class="accent" x="801" y="83" font-size="10">302 presign</text>
  <polyline class="req" points="780,120 830,120 830,345 878,345" marker-end="url(#a-req)"/>
  <text class="accent" x="822" y="300" font-size="11" text-anchor="end">contact mail</text>

  <!-- Admin and delivery paths -->
  <line class="ops" x1="680" y1="465" x2="680" y2="262" marker-end="url(#a-ops)"/>
  <text class="muted" x="688" y="372" font-size="11">read/write, migrations</text>
  <polyline class="ops" points="780,495 1055,495 1055,277" marker-end="url(#a-ops)"/>
  <text class="muted" x="910" y="488" font-size="11" text-anchor="middle">uploads, variants</text>
  <polyline class="ops" points="400,465 400,170 610,170 610,137" marker-end="url(#a-ops)"/>
  <text class="muted" x="408" y="320" font-size="11">deploys function</text>
  <polyline class="ops" points="150,465 150,190 300,190 300,137" marker-end="url(#a-ops)"/>
  <text class="muted" x="158" y="320" font-size="11">deploys Worker</text>
  <polyline class="ops" points="115,525 115,595 680,595 680,527" marker-end="url(#a-ops)"/>
  <text class="muted" x="400" y="588" font-size="11" text-anchor="middle">release → GHCR image → docker pull</text>

  <!-- Legend -->
  <line class="req" x1="880" y1="545" x2="910" y2="545"/>
  <text class="muted" x="918" y="549" font-size="11">visitor traffic</text>
  <line class="ops" x1="880" y1="567" x2="910" y2="567"/>
  <text class="muted" x="918" y="571" font-size="11">admin and deploys</text>
</svg>
