name: portfolio-stage

# ---------- Backend Defaults ----------
x-backend-defaults: &backend-defaults
  volumes:
    - portfolio_staging_media_data:/app/media
    - portfolio_staging_static_data:/app/staticfiles
  networks:
    - stage_network
    - traefik_proxy
  environment: &backend-defaults-env
    DEBUG: "False"
    PYTHONPATH: "."
    TZ: "Europe/Warsaw"
    SECRET_KEY: ${SECRET_KEY}
    DB_NAME: portfolio_stage
    MEDIA_STORAGE: ${MEDIA_STORAGE:-local}
    DB_USER: ${DB_USER:-portfolio}
    DB_PASSWORD: ${DB_PASSWORD}
    DB_HOST: db
    DB_PORT: 5432
    ADMIN_DOMAIN: ${ADMIN_DOMAIN}
    API_DOMAIN: ${API_DOMAIN}
    SITE_DOMAIN: ${SITE_DOMAIN}
    CSRF_COOKIE_DOMAIN: ${CSRF_COOKIE_DOMAIN}
    ALLOWED_HOSTS: ${ALLOWED_HOSTS}
    CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
    EMAIL_HOST: ${EMAIL_HOST}
    EMAIL_PORT: ${EMAIL_PORT}
    EMAIL_USE_TLS: ${EMAIL_USE_TLS}
    EMAIL_HOST_USER: ${EMAIL_HOST_USER}
    EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
    DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL}
    CONTACT_EMAIL: ${CONTACT_EMAIL}
    SESSION_COOKIE_DOMAIN: ${SESSION_COOKIE_DOMAIN}
    SENTRY_DSN: ${SENTRY_DSN:-}
    ENABLE_SENTRY: ${ENABLE_SENTRY:-false}
    ENVIRONMENT: stage
    SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.0}
    OPENAI_API_KEY: ${OPENAI_API_KEY}
    PROJECT_OWNER: ${PROJECT_OWNER:-Lukasz}
    SKIP_PERMISSION_FIX: ${SKIP_PERMISSION_FIX:-false}
    SSR_CACHE_INVALIDATION_URL: ""
    SSR_CACHE_INVALIDATION_TOKEN: ${SSR_CACHE_INVALIDATION_TOKEN}
  depends_on:
    db:
      condition: service_healthy

networks:
  stage_network:
  traefik_proxy:
    external: true

services:
  # ---------- Database ----------
  db:
    image: postgres:18
    restart: always
    networks:
      - stage_network
    environment:
      POSTGRES_DB: portfolio_stage
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - portfolio_staging_db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d portfolio_stage"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------- Backend ----------
  be:
    <<: *backend-defaults
    image: ${ENVIRONMENT}-be:${TAG}
    restart: always
    environment:
      <<: *backend-defaults-env
    volumes:
      - portfolio_staging_media_data:/app/media
      - portfolio_staging_static_data:/app/staticfiles
    healthcheck:
      test: ["CMD-SHELL", "curl -f -H 'X-Forwarded-Proto: https' http://127.0.0.1:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      db:
        condition: service_healthy

  # ---------- Release Job ----------
  release:
    <<: *backend-defaults
    image: ${ENVIRONMENT}-be:${TAG}
    restart: "no"
    environment:
      <<: *backend-defaults-env
    command: >
      sh -c "
        python manage.py migrate --noinput &&
        python manage.py createcachetable &&
        python scripts/release_entrypoint.py &&
        python manage.py collectstatic --noinput
      "

  # ---------- Nginx ----------
  nginx:
    image: ${ENVIRONMENT}-nginx:${TAG}
    restart: always
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - stage_network
      - traefik_proxy
    volumes:
      - portfolio_staging_media_data:/app/media:ro
      - portfolio_staging_static_data:/app/staticfiles:ro
      - portfolio_staging_nginx_blocklist:/etc/nginx/blocklist:ro
    labels:
      - "traefik.enable=true"
      # Main site routing
      - "traefik.http.routers.staging-site.rule=Host(`${SITE_DOMAIN}`)"
      - "traefik.http.routers.staging-site.entrypoints=websecure"
      - "traefik.http.routers.staging-site.tls=true"
      - "traefik.http.routers.staging-site.tls.certresolver=letsencrypt"
      - "traefik.http.routers.staging-site.middlewares=allowed-ips@docker,staging-security@file"
      - "traefik.http.routers.staging-site.service=staging-site"

      # Admin routing
      - "traefik.http.routers.staging-admin.rule=Host(`${ADMIN_DOMAIN}`)"
      - "traefik.http.routers.staging-admin.entrypoints=websecure"
      - "traefik.http.routers.staging-admin.tls=true"
      - "traefik.http.routers.staging-admin.tls.certresolver=letsencrypt"
      - "traefik.http.routers.staging-admin.middlewares=allowed-ips@docker,staging-security@file,rate-limit@file"
      - "traefik.http.routers.staging-admin.priority=2"
      - "traefik.http.routers.staging-admin.service=staging-site"

      - "traefik.http.services.staging-site.loadbalancer.server.port=80"

  # ---------- Cloudflare Tunnel ----------
  # Private link for the Cloudflare Workers frontend (portfolio-fe) to reach
  # the backend like the in-network `fe` does today (http://be:8000). Outbound
  # only: no ports are opened. The public hostname is protected by Cloudflare
  # Access (service token). Not part of deploy.sh; start once after
  # CLOUDFLARE_TUNNEL_TOKEN is in Doppler:
  #   doppler run -- docker compose -f docker-compose.stage.yml up -d cloudflared
  cloudflared:
    image: cloudflare/cloudflared:2026.10.7
    profiles: ["tunnel"]
    restart: always
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - stage_network

volumes:
  portfolio_staging_db_data:
    external: true
  portfolio_staging_media_data:
    external: true
  portfolio_staging_static_data:
    external: true
  portfolio_staging_nginx_blocklist:
    external: true
