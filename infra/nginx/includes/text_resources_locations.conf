location = /robots.txt {
    if ($text_resources_directory = "") {
        return 404;
    }
    alias $text_resources_directory/robots.txt;
    default_type text/plain;
    charset utf-8;
    add_header Cache-Control "public, max-age=3600";
}

location = /.well-known/security.txt {
    if ($text_resources_directory = "") {
        return 404;
    }
    alias $text_resources_directory/.well-known/security.txt;
    default_type text/plain;
    charset utf-8;
    add_header Cache-Control "public, max-age=3600";
}
